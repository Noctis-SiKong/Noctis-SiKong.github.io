标签</a><div class=page-heading><h1>Kruskal</h1><span>2 篇文章</span></div><div class=index-rows><article class=post-row><div class=meta><a class=category href=/categories/%E5%9B%BE%E8%AE%BA/>图论</a><span aria-hidden=true>/</span><time datetime=2025-12-25T19:30:10+08:00>2025.12.25</time></div><h3><a href=/post/%E6%9C%80%E5%B0%8F%E7%94%9F%E6%88%90%E6%A0%91mst--prim-%E7%AE%97%E6%B3%95/>最小生成树（MST）<span class=row-arrow><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></span></a></h3><p>最小生成树（MST）适用于无向连通图，核心目标是：找到一组边，满足「连接所有顶点」且「边权和最小」，同时无环。</p></article><article class=post-row><div class=meta><a class=category href=/categories/%E7%AE%97%E6%B3%95/>算法</a><span aria-hidden=true>/</span><time datetime=2025-12-10T19:30:10+08:00>2025.12.10</time></div><h3><a href=/post/%E6%9D%91%E6%9D%91%E9%80%9A%E9%97%AE%E9%A2%98/>村村通问题<span class=row-arrow><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></span></a></h3><p>本题要求计算使所有村落连通的最低公路建设成本，本质是求解最小生成树（MST） 问题。最小生成树的核心是在无向图中选择 N-1 条边（N 为节点数），使得所有节点连通且总权重最小 …</p></article></div></div></main><footer class="footer wrap"><a href=/>Noctis 手记</a><div><a href=/about/>关于作者</a><a href=/index.xml>RSS <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 5a14 14 0 0114 14M5 11a8 8 0 018 8"/><circle cx="6" cy="18" r="1"/></svg></a></div></footer></body></html>
